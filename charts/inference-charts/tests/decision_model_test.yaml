suite: decision-model deployment regressions
templates:
  - templates/decision-model-deployment.yaml
set:
  inference.framework: kev
  inference.accelerator: gpu
  model: org/model
tests:
  - it: renders nothing for other frameworks
    set:
      inference.framework: vllm
    asserts:
      - hasDocuments:
          count: 0

  - it: rejects non-GPU accelerators
    set:
      inference.accelerator: neuron
    asserts:
      - failedTemplate:
          errorMessage: "inference.framework kev requires inference.accelerator: gpu"

  - it: uses shared deployment defaults when settings are unset
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.progressDeadlineSeconds
          value: 1800
      - equal:
          path: spec.revisionHistoryLimit
          value: 2
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
      - equal:
          path: spec.template.spec.tolerations
          value:
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: uses configurable decision defaults from values.yaml
    set:
      decisionModel.deployment.runtimeClassName: custom-nvidia
      decisionModel.deployment.strategy: {type: RollingUpdate}
      decisionModel.deployment.progressDeadlineSeconds: 600
      decisionModel.deployment.revisionHistoryLimit: 0
      decisionModel.deployment.terminationGracePeriodSeconds: 0
      decisionModel.deployment.tolerations: []
      decisionModel.deployment.podAnnotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "9000"
      decisionModel.deployment.readinessProbe:
        httpGet: {path: /ready, port: http}
      decisionModel.extraLabels:
        team: decisions
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: custom-nvidia
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.progressDeadlineSeconds
          value: 600
      - equal:
          path: spec.revisionHistoryLimit
          value: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
      - equal:
          path: spec.template.spec.tolerations
          value: []
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "false"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9000"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /ready
      - equal:
          path: metadata.labels.team
          value: decisions

  - it: uses shared defaults when grace period and tolerations are null
    set:
      inference.modelServer.deployment.terminationGracePeriodSeconds: null
      inference.modelServer.deployment.tolerations: null
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 120
      - equal:
          path: spec.template.spec.tolerations
          value:
            - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}

  - it: preserves explicit zero grace and empty tolerations over model values
    values:
      - ../values-decision-strands-decider-2b.yaml
    set:
      inference.modelServer.deployment.terminationGracePeriodSeconds: 0
      inference.modelServer.deployment.tolerations: []
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0
      - equal:
          path: spec.template.spec.tolerations
          value: []

  - it: preserves custom deployment defaults and zero revision history
    set:
      inference.modelServer.deployment.strategy: {type: RollingUpdate}
      inference.modelServer.deployment.progressDeadlineSeconds: 900
      inference.modelServer.deployment.revisionHistoryLimit: 0
      inference.modelServer.deployment.terminationGracePeriodSeconds: 5
      inference.modelServer.deployment.tolerations:
        - {key: custom-gpu, operator: Exists, effect: NoSchedule}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.progressDeadlineSeconds
          value: 900
      - equal:
          path: spec.revisionHistoryLimit
          value: 0
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 5
      - equal:
          path: spec.template.spec.tolerations
          value:
            - {key: custom-gpu, operator: Exists, effect: NoSchedule}

  - it: installs pinned packages, downloads the pinned revision, and execs the Kev server
    set:
      decisionModel.revision: abc123
      decisionModel.containerPort: 8008
      decisionModel.pipInstalls:
        - indexUrl: https://download.pytorch.org/whl/cu128
          packages: [torch==2.8.0]
        - packages: ["kev[serve] @ https://example.com/kev.tar.gz"]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "python3 -m pip install --no-cache-dir --index-url 'https://download.pytorch.org/whl/cu128' 'torch==2.8.0'\n"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "python3 -m pip install --no-cache-dir 'kev\\[serve\\] @ https://example.com/kev.tar.gz'\n"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download\(repo_id="org/model", revision="abc123", local_dir="/models/checkpoint"\)'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'exec python3 -m kev\.serve --run /models/checkpoint --host 0\.0\.0\.0 --port 8008\n?$'
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8008

  - it: renders strands-decider modelParameters as server flags without vLLM flags
    set:
      inference.framework: strands-decider
      modelParameters:
        device: cuda
        maxBatch: 16
        modelName: served-name
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'exec strands-decider serve /models/checkpoint --host 0\.0\.0\.0 --port 8000 --device cuda --max-batch 16 --model-name served-name\n?$'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '%!|--tensor-parallel-size'
      - equal:
          path: spec.template.spec.containers[0].name
          value: strands-decider

  - it: downloads the checkpoint and execs the Surogate server
    set:
      inference.framework: surogate
      decisionModel.revision: abc123
      modelParameters:
        maxNumSeqs: 8
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download\(repo_id="org/model", revision="abc123", local_dir="/models/checkpoint"\)'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'exec surogate serve /models/checkpoint --host 0\.0\.0\.0 --port 8000 --max-num-seqs 8\n?$'

  - it: lets vLLM download the model for the decider server
    set:
      inference.framework: decider
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download|--tensor-parallel-size'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "export DECIDER_MODEL='org/model'"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'exec uvicorn decider\.serve_vllm:app --host 0\.0\.0\.0 --port 8000\n?$'

  - it: downloads the pinned Perplexity snapshot and starts its native HTTP adapter
    set:
      inference.framework: pplx-decider
      decisionModel.revision: abc123
      modelParameters:
        mode: separate
        maxLength: 8192
        batchTokens: 8192
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download\(repo_id="org/model", revision="abc123", local_dir="/models/checkpoint"\)'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'from pplx_decider import Decider, LengthError, RequestError'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "exec python3 /tmp/pplx-decider-server\\.py --checkpoint /models/checkpoint --model-name 'org/model' --host 0\\.0\\.0\\.0 --port 8000 --batch-tokens 8192 --max-length 8192 --mode separate\n?$"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '--tensor-parallel-size|exec vllm serve'

  - it: selects the G7e family for the Perplexity 27B preset with HTTP probes
    values:
      - ../values-decision-pplx-decider-v1-3.yaml
    set:
      inference.framework: pplx-decider
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^python:3\.12-bookworm@sha256:'
      - notExists:
          path: spec.template.spec.nodeSelector
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g7e]}
            - matchExpressions:
                - {key: eks.amazonaws.com/instance-family, operator: In, values: [g7e]}
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "false"

  - it: selects the G5 family for the Perplexity Flash preset with HTTP probes
    values:
      - ../values-decision-pplx-decider-flash-v1-3.yaml
    set:
      inference.framework: pplx-decider
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: '^python:3\.12-bookworm@sha256:'
      - notExists:
          path: spec.template.spec.nodeSelector
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g5]}
            - matchExpressions:
                - {key: eks.amazonaws.com/instance-family, operator: In, values: [g5]}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].resources.requests["nvidia.com/gpu"]
          value: 1
      - equal:
          path: spec.template.spec.containers[0].resources.limits["nvidia.com/gpu"]
          value: 1

  - it: execs vllm serve at the pinned revision for decision-vllm
    set:
      inference.framework: decision-vllm
      decisionModel.revision: abc123
      modelParameters:
        tensorParallelSize: 1
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: snapshot_download
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "exec vllm serve 'org/model' --revision abc123 --host 0\\.0\\.0\\.0 --port 8000 --tensor-parallel-size 1\n?$"

  - it: omits the revision when none is pinned
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download\(repo_id="org/model", local_dir="/models/checkpoint"\)'

  - it: preserves required node affinity alongside the chart's pod affinity
    set:
      inference.modelServer.deployment.nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g7e]}
            - matchExpressions:
                - {key: eks.amazonaws.com/instance-family, operator: In, values: [g7e]}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g7e]}
            - matchExpressions:
                - {key: eks.amazonaws.com/instance-family, operator: In, values: [g7e]}
      - exists:
          path: spec.template.spec.affinity.podAffinity

  - it: combines the family with custom required and preferred node affinity
    set:
      inference.modelServer.deployment.instanceFamily: g5
      inference.modelServer.deployment.nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
                - {key: topology.kubernetes.io/zone, operator: In, values: [us-east-2a]}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms
          value:
            - matchExpressions:
                - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
                - {key: karpenter.k8s.aws/instance-family, operator: In, values: [g5]}
            - matchExpressions:
                - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
                - {key: eks.amazonaws.com/instance-family, operator: In, values: [g5]}
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 50

  - it: uses an exact instance type without redundant family affinity
    set:
      inference.modelServer.deployment.instanceFamily: g5
      inference.modelServer.deployment.instanceType: g7e.4xlarge
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {node.kubernetes.io/instance-type: g7e.4xlarge}
      - notExists:
          path: spec.template.spec.affinity.nodeAffinity

  - it: serves a local checkpoint from an existing PVC without downloading or adding vLLM flags
    set:
      decisionModel.modelCacheExistingClaim: model-weights
      modelPath: /models/model weights
      vllm.loadFormat: runai_streamer
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value: {name: model-cache, persistentVolumeClaim: {claimName: model-weights}}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: model-cache, mountPath: /models}
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'snapshot_download|--load-format|--served-model-name|--tensor-parallel-size'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "exec python3 -m kev\\.serve --run '/models/model weights'"

  - it: serves a local vLLM checkpoint with its original model name
    set:
      inference.framework: decision-vllm
      modelPath: /models/model weights
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "exec vllm serve '/models/model weights'.*--served-model-name org/model.*--tensor-parallel-size 1"
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: snapshot_download

  - it: uses the local Decider path while respecting an explicit environment model otherwise
    set:
      inference.framework: decider
      modelPath: /models/local-decider
      inference.modelServer.env.DECIDER_MODEL: org/override
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "export DECIDER_MODEL='/models/local-decider'"

  - it: preserves a custom served name for a local vLLM checkpoint without adding a second name flag
    set:
      inference.framework: decision-vllm
      modelPath: /models/local-model
      modelParameters.servedModelName: custom-model
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '--served-model-name custom-model'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '--served-model-name org/model'

  - it: keeps an explicitly configured Decider environment model
    set:
      inference.framework: decider
      inference.modelServer.env.DECIDER_MODEL: org/override
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DECIDER_MODEL, value: org/override}
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'if \[\[ -z "\$\{DECIDER_MODEL:-\}" \]\]'

  - it: enables scraping only for a server with a Prometheus endpoint
    set:
      inference.framework: decision-vllm
      decisionModel.containerPort: 9000
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9000"

  - it: renders no affinity when node and pod affinity are both unset
    set:
      inference.modelServer.deployment.podAffinity.enabled: false
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: hardens the pod and keeps the service account token unmounted
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}

  - it: defaults to HTTP health probes and a 30 minute startup window
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 180}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health

  - it: keeps Kev TCP probes without inheriting HTTP handlers
    values:
      - ../values-decision-kev-27b.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value: {tcpSocket: {port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 180}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: {tcpSocket: {port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value: {tcpSocket: {port: http}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "false"
      - notExists:
          path: spec.template.metadata.annotations["prometheus.io/port"]

  - it: lets deployment overrides replace probe handlers and disable the runtime class
    set:
      inference.modelServer.deployment.runtimeClassName: ""
      inference.modelServer.deployment.readinessProbe:
        exec: {command: ["/bin/true"]}
        periodSeconds: 20
      inference.modelServer.deployment.livenessProbe:
        tcpSocket: {port: http}
        periodSeconds: 15
      extraLabels:
        app.kubernetes.io/part-of: custom-models
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value: {exec: {command: ["/bin/true"]}, periodSeconds: 20}
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value: {tcpSocket: {port: http}, periodSeconds: 15}
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: custom-models
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: custom-models

  - it: relies on the NVIDIA runtime without explicit host driver mounts
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: LD_LIBRARY_PATH
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nvidia-libcuda
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia-libcuda
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nvidia-libnvidia-ml
          any: true
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: nvidia-libnvidia-ml
          any: true

  - it: requires the Kev API key secret in the Kev values file
    values:
      - ../values-decision-kev-27b.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KEV_API_KEY
            valueFrom:
              secretKeyRef: {name: kev-api-key, key: api-key}
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.template.spec.runtimeClassName
          value: nvidia

  - it: exposes the server only inside the cluster on the chart's service port
    values:
      - ../values-decision-strands-decider-2b.yaml
    documentSelector: {path: kind, value: Service}
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: decision-models
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0]
          value: {port: 8000, targetPort: http, protocol: TCP, name: http}
