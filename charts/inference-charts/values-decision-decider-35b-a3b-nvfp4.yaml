# Decider 35B-A3B NVFP4 decision model (https://huggingface.co/Mapika/decider-35b-a3b-nvfp4)
# served by the decider vLLM server on one NVIDIA GPU in the g7e instance family, with Bottlerocket nodes.
#
# The pod starts from the pinned vLLM 0.33 CUDA 13 image, installs the decider-ai server without
# dependencies (vLLM provides them) and runs `uvicorn decider.serve_vllm:app`.
# The server takes its settings from DECIDER_* env vars
# and loads DECIDER_MODEL through vLLM; it has no revision setting, so the default branch is served.
model: Mapika/decider-35b-a3b-nvfp4

extraLabels:
  app.kubernetes.io/name: decider-35b-a3b-nvfp4
  app.kubernetes.io/version: "vllm-0.33.0"

decisionModel:
  modelCacheSize: 200Gi
  pipInstalls:
    - packages:
        - --no-deps
        - "--only-binary=:all:"
        - decider-ai==1.10.0

inference:
  serviceName: decider-35b-a3b-nvfp4
  framework: decider

  modelServer:
    image:
      repository: vllm/vllm-openai
      tag: v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    deployment:
      instanceFamily: g7e
      sharedMemory: 8Gi
      resources:
        gpu:
          requests:
            cpu: "6"
            memory: 48Gi
            ephemeral-storage: 40Gi
          limits:
            memory: 60Gi
            ephemeral-storage: 200Gi
    env:
      DECIDER_VLLM_MAX_MODEL_LEN: "34816"
      DECIDER_VLLM_MAX_NUM_SEQS: "32"
