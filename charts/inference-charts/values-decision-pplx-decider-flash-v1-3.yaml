# Perplexity Decider Flash v1.3 (4B), served by the native pplx_decider library on
# one G5 A10G GPU with Bottlerocket. The BF16 weights occupy about 8.5 GiB.
# https://huggingface.co/perplexity-ai/pplx-decider-flash-v1.3
#
# Flash shares the 27B model's v1.3 protocol, including image and Locate support.
# CUDA 13 wheels require an NVIDIA R580 or newer host driver.
model: perplexity-ai/pplx-decider-flash-v1.3

modelParameters:
  maxLength: 8192
  batchTokens: 8192
  cpuThreads: 4

extraLabels:
  app.kubernetes.io/name: pplx-decider-flash-v1-3
  app.kubernetes.io/version: "pplx-decider-0.5.0"

decisionModel:
  revision: d06fb3f2d97e0a52325a0d463c450cf0338f44fe
  modelCacheSize: 60Gi
  pipInstalls:
    - indexUrl: https://download.pytorch.org/whl/cu130
      packages:
        - torch==2.14.0
        - torchvision==0.29.0
    - packages:
        - transformers==5.17.0
        - safetensors==0.8.0
        - pillow==12.3.0
        - huggingface-hub==1.31.0
        - fastapi==0.163.1
        - uvicorn==0.54.0

inference:
  serviceName: pplx-decider-flash-v1-3
  framework: pplx-decider

  modelServer:
    image:
      repository: python
      # The full image includes the compiler and headers required by Triton.
      tag: 3.12-bookworm@sha256:4209fae09a3e20afd863e528bfddc235da5fd5977983e1996cd54cc9a72e6267
    deployment:
      instanceFamily: g5
      sharedMemory: 4Gi
      resources:
        gpu:
          requests:
            cpu: "4"
            memory: 20Gi
            ephemeral-storage: 20Gi
          limits:
            memory: 28Gi
            ephemeral-storage: 80Gi
