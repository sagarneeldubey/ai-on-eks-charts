# Perplexity Decider Flash v1.3 (4B), served by the native pplx_decider library on
# one G5 A10G GPU with Bottlerocket. The BF16 weights occupy about 8.5 GiB.
# https://huggingface.co/perplexity-ai/pplx-decider-flash-v1.3
#
# Flash shares the 27B model's v1.3 protocol, including image and Locate support.
# CUDA 13 wheels require an NVIDIA R580 or newer host driver.
model: perplexity-ai/pplx-decider-flash-v1.3

modelParameters:
  device: cuda
  mode: separate
  maxLength: 8192
  batchTokens: 8192
  cpuThreads: 4

extraLabels:
  app.kubernetes.io/name: pplx-decider-flash-v1-3
  app.kubernetes.io/part-of: decision-models
  app.kubernetes.io/version: "pplx-decider-0.5.0"

decisionModel:
  revision: d06fb3f2d97e0a52325a0d463c450cf0338f44fe
  containerPort: 8000
  modelCacheSize: 60Gi
  pipInstalls:
    - indexUrl: https://download.pytorch.org/whl/cu130
      packages:
        - torch==2.14.0
        - torchvision==0.29.0
    - packages:
        - transformers==5.17.0
        - safetensors==0.8.0
        - pillow==12.3.0
        - huggingface-hub==1.31.0
        - fastapi==0.163.1
        - uvicorn==0.54.0
  hostDriverLibs:
    enabled: true
    mountDir: /usr/local/lib
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 180

inference:
  serviceName: pplx-decider-flash-v1-3
  serviceNamespace: default
  accelerator: gpu
  framework: pplx-decider

  modelServer:
    image:
      repository: python
      tag: 3.12-slim-bookworm@sha256:57d96f71de145a98e7ceca18ee4ade77bba4103a33a72dfaea026b23625c6bf0
    deployment:
      replicas: 1
      runtimeClassName: nvidia
      instanceType: g5.2xlarge
      sharedMemory: 4Gi
      podAnnotations:
        prometheus.io/scrape: "false"
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: karpenter.k8s.aws/instance-family
                  operator: In
                  values: [g5]
                - key: kubernetes.io/arch
                  operator: In
                  values: [amd64]
            - matchExpressions:
                - key: eks.amazonaws.com/instance-family
                  operator: In
                  values: [g5]
                - key: kubernetes.io/arch
                  operator: In
                  values: [amd64]
      readinessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        gpu:
          requests:
            cpu: "4"
            memory: 20Gi
            ephemeral-storage: 20Gi
            nvidia.com/gpu: 1
          limits:
            memory: 28Gi
            ephemeral-storage: 80Gi
            nvidia.com/gpu: 1
